<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="120" y1="160" x2="390" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8627a"/>
      <stop offset="100%" stop-color="#c2185b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Ambient glow behind heart -->
  <ellipse cx="256" cy="265" rx="130" ry="110" fill="#e8627a" opacity="0.18" filter="url(#softglow)"/>

  <!-- Heart path (centered, filled with gradient) -->
  <path
    d="M256 370
       C256 370 110 280 110 188
       C110 148 140 120 180 120
       C208 120 232 136 256 160
       C280 136 304 120 332 120
       C372 120 402 148 402 188
       C402 280 256 370 256 370Z"
    fill="url(#heartGrad)"
    filter="url(#glow)"
  />

  <!-- Highlight gloss on heart -->
  <ellipse cx="216" cy="185" rx="36" ry="22" fill="white" opacity="0.12" transform="rotate(-20 216 185)"/>

  <!-- Sparkle top-right -->
  <g opacity="0.7">
    <line x1="378" y1="118" x2="378" y2="102" stroke="#f9a8b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="370" y1="110" x2="386" y2="110" stroke="#f9a8b8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Sparkle top-left -->
  <g opacity="0.5">
    <line x1="138" y1="148" x2="138" y2="136" stroke="#f9a8b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="132" y1="142" x2="144" y2="142" stroke="#f9a8b8" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Sparkle bottom-right -->
  <g opacity="0.45">
    <line x1="395" y1="310" x2="395" y2="300" stroke="#f9a8b8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="390" y1="305" x2="400" y2="305" stroke="#f9a8b8" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>